name: C99 contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        trace: [0, 64]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DRTM_TRACE_CAPACITY=${{ matrix.trace }} -DRTM_SANITIZE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: python3 tools/check_format.py
      - run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c99 -Iinclude src
      - run: gcc -std=c99 -Wall -Wextra -Werror -fanalyzer -Iinclude -c src/rtm.c src/port.c
      - run: python3 tests/test_tools.py
